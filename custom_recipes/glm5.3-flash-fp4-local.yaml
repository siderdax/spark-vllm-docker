# Recipe: GLM-5.3-Flash-FP4-Local (NVIDIA first-party QAD checkpoint), TP2 on 2x DGX Spark
#
# Active default (2026-10-27). Upstream (merge b62168e) settings: A16 MoE decode (VLLM_B12X_MOE_FP4_FORCE_A16=1,
# B12X_W4A16_A4_PREFILL=1), PYTORCH_ALLOC_CONF cap, NCCL_BUFFSIZE/NCCL_MAX_CTAS, util 0.80, no pipeline_parallel
# (the CSF path requires PP1). Needs eugr/spark-vllm-b12x:latest (2026-10-26 build or newer); ~165 GiB in the HF cache on BOTH
# nodes (quaker has no internet: download on raven, copy with `rsync -L`).
# A16 is a precision setting (see the Flash-Next solo recipe header), not a speed one.
# max_model_len 393,216 (upstream card says 500,000): A16 + util 0.80 leaves KV of only ~0.68-0.84M tokens per boot
# (1.7x at 393K; 500K would be 1.4x-1.7x and leaves one request at a time). VERIFIED 2026-10-27: context-bench 8K/98K/246K and
# 3 x 390,888 tokens (depth 0.1/0.5/0.9, ~194s each) pass, server stayed healthy. llama-benchy pp2048/pp16384:
# prefill 1747/2199 t/s, decode 35.4/37.3 t/s (baseline: 1624/1804 and 33.3/37.6). Only ~4-6 GB RAM is available on each node
# after load (swap 5.7G on raven): do not raise util, and keep other big jobs off the nodes. Baseline (util 0.87, 500K,
# KV 1.66M tokens, ~16 GB free): see glm5.3-flash-fp4-local-baseline.yaml.
# GLM ignores the thinking-off request, so context-bench answers contain reasoning text (the number is still in it).

recipe_version: "1"
name: GLM-5.3-Flash-FP4-Local
description: vLLM serving nvidia/GLM-5.3-Flash-FP4-Local on a dual DGX Spark cluster

model: nvidia/GLM-5.3-Flash-FP4-Local
container: eugr/spark-vllm-b12x:latest

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  decode_context_parallel: 1
  block_size: 256
  max_model_len: 393216
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  num_speculative_tokens: 5
  kv_cache_memory_bytes: 8G
  gpu_memory_utilization: 0.8

env:
  # Bound cached CUDA reservations during A16 preparation on Spark's shared RAM.
  PYTORCH_ALLOC_CONF: "per_process_memory_fraction:0.8"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  NCCL_BUFFSIZE: "1048576"
  NCCL_MAX_CTAS: "8"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_POLICY_MODE: "auto"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

command: |
  vllm serve nvidia/GLM-5.3-Flash-FP4-Local \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --decode-context-parallel-size {decode_context_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend b12x \
    --linear-backend b12x \
    --no-enable-flashinfer-autotune \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"moe_backend":"humming","attention_backend":"B12X"}}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --gpu-memory-utilization {gpu_memory_utilization}
