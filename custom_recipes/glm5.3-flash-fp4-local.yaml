# Recipe: GLM-5.3-Flash-FP4-Local (NVIDIA first-party QAD checkpoint), TP2 on 2x DGX Spark
#
# Added 2026-10-27 for a quality comparison against the active GLM-5.3-Flash
# recipes.
# VERIFIED 2026-10-27 on raven+quaker (eugr/spark-vllm-b12x built 2026-10-26): KV 1,656,716 tokens (3.31x at 500K),
# context-bench 12/12 (8K-246K) plus 482K, llama-benchy pp2048/pp16384: prefill 1624/1804 t/s, decode 33.3/37.6 t/s.
# Ready in ~6 min with a warm b12x cache. GLM ignores the thinking-off request, so context-bench answers contain
# reasoning text (the number is still in it). Mirrors the 2 x DGX Spark launch on the
# model card (https://huggingface.co/nvidia/GLM-5.3-Flash-FP4-Local): 500K max
# len, FP8 KV (~2M-token pool), 4 seqs, MTP-5, util 0.87, block 256, b12x stack.
# The checkpoint's NVFP4 scale factors use a compression format upstream vLLM
# does not read yet, so it needs the community eugr/spark-vllm-b12x image
# (present on both nodes). ~165 GiB, must be in the HF cache on BOTH nodes
# (quaker has no internet: download on raven, then copy with hf-download.sh -c).

recipe_version: "1"
name: GLM-5.3-Flash-FP4-Local
description: vLLM serving nvidia/GLM-5.3-Flash-FP4-Local on a dual DGX Spark cluster

model: nvidia/GLM-5.3-Flash-FP4-Local
container: eugr/spark-vllm-b12x:latest

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  decode_context_parallel: 1
  block_size: 256
  max_model_len: 500000
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  num_speculative_tokens: 5
  gpu_memory_utilization: 0.87

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_POLICY_MODE: "auto"
  INSTANTTENSOR_BACKEND: "BUFFERED"
  INSTANTTENSOR_BUFFER_SIZE: "67108864"
  INSTANTTENSOR_CHUNK_SIZE: "8388608"
  INSTANTTENSOR_CONCURRENCY: "1"
  INSTANTTENSOR_IO_DEPTH: "3"

command: |
  vllm serve nvidia/GLM-5.3-Flash-FP4-Local \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --decode-context-parallel-size {decode_context_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend b12x \
    --linear-backend b12x \
    --no-enable-flashinfer-autotune \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"moe_backend":"humming","attention_backend":"B12X"}}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --gpu-memory-utilization {gpu_memory_utilization}
