# Recipe: Qwen3.8-Flash-Next-FP4-Local (solo) -- NVIDIA QAD checkpoint (NVFP4 experts + MXFP8 attention), one node
#
# Active default (2026-10-27). Upstream (eugr/spark-vllm-docker, merge b62168e) settings: A16 MoE decode
# (VLLM_B12X_MOE_FP4_FORCE_A16=1, B12X_W4A16_A4_PREFILL=1), PYTORCH_ALLOC_CONF cap, B12X_DISK_BACKEND=io_uring, PLE on disk.
# Runs on eugr/spark-vllm-b12x:latest (2026-10-26 build or newer). The 2026-10-11 image fails with
# ImportError CsfScalePlanes (renamed CsfBlockPlanes).
# The A16 flags are a precision setting, not a speed one: FORCE_A16 keeps decode activations in BF16, A4_PREFILL lets
# prefill use NVFP4 activations (upstream PR reports ~3x more needle near-misses, 0.53% -> 1.75%). Quality was not measured here.
# VERIFIED 2026-10-27 on raven (util 0.80): KV 893,865 tokens (3.4x at 262K), context-bench 8K/100K/243K pass,
# llama-benchy pp2048/pp16384: prefill 1710/2068 t/s, decode 36.1/35.4 t/s. vs baseline file: prefill +2-5%, decode within noise,
# KV -6%, first start 25.5 min (cold compile cache). ~16 GB RAM free after load. Baseline numbers: see *-solo-baseline.yaml.
# max-model-len 262144 works (baseline reached 260,279 tokens on quaker). context-bench asks for 1500 output tokens, so prompts
# over ~260.6K tokens get a 400 (not an OOM).

recipe_version: "1"
name: Qwen3.8-Flash-Next-FP4-Local (Solo)
description: vLLM serving nvidia/Qwen3.8-Flash-Next-FP4-Local on one DGX Spark with PLE disk offload

model: nvidia/Qwen3.8-Flash-Next-FP4-Local
container: eugr/spark-vllm-b12x:latest

solo_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: nvidia/Qwen3.8-Flash-Next-FP4-Local
  tensor_parallel: 1
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.8

env:
  # Bound PyTorch CUDA reservation during A16 weight preparation on shared RAM.
  # This allocator cap is independent of vLLM's gpu_memory_utilization budget.
  PYTORCH_ALLOC_CONF: "per_process_memory_fraction:0.8"
  VLLM_PLE_TABLE_MEMORY: "disk"
  B12X_DISK_BACKEND: "io_uring"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_MXFP8_LM_HEAD: "1"
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: "w13"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

command: |
  vllm serve nvidia/Qwen3.8-Flash-Next-FP4-Local \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
