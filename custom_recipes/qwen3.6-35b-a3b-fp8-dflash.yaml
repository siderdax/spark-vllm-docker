# Recipe: Qwen/Qwen3.6-35B-A3B-FP8
# Qwen/Qwen3.6-35B-A3B model in native FP8 format
#
# Sampling: --override-generation-config below sets Qwen's documented thinking-mode
# defaults for this A3B (MoE) variant: temperature=1.0, top_p=0.95, top_k=20,
# presence_penalty=1.5 — note presence_penalty=1.5 here vs 0.0 recommended for the
# dense 27B model (helps avoid MoE repetition loops). vLLM's own top_k/presence_penalty
# defaults (-1 / 0.0) diverge from this, so this only fills gaps for clients that
# don't set their own sampling params.
#
# Unlike Qwen3.8, this chat template (mods/fix-qwen3.6-chat-template) has no
# reasoning_effort mechanism — thinking is just on/off, no xhigh/medium/low budget.
# preserve_thinking still defaults to true though, and re-injects every prior turn's
# full <think> block into context on multi-turn requests, which snowballs context
# size (and latency) over a long opencode/agentic session:
#   --default-chat-template-kwargs '{"preserve_thinking": false}'
#
# Tool-call parser: qwen3_xml (below) is correct — do not switch to qwen3_coder even
# though Qwen's own model card recommends it. It has a known vLLM bug (infinite "!"
# stream on long inputs with a tool call, vllm-project/vllm#39056) affecting the
# whole Qwen3 family, not just this model.


recipe_version: "1"
name: Qwen36-35B-A3B
description: vLLM serving Qwen3.6-35B-A3B-FP8

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.6-35B-A3B-FP8

#solo_only: true

# Container image to use
container: vllm-node

# Mod required to fix slowness and crash in the cluster (tracking https://github.com/vllm-project/vllm/issues/33857)
mods:
  - mods/fix-qwen3.6-chat-template

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 16384

# Environment variables
env: 
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

# The vLLM serve command template
command: |
  vllm serve Qwen/Qwen3.6-35B-A3B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --override-generation-config '{{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "presence_penalty": 1.5}}' \
    --load-format fastsafetensors \
    --attention-backend flash_attn \
    --chat-template fixed_chat_template.jinja \
    --speculative-config '{{"method": "dflash", "model": "z-lab/Qwen3.6-35B-A3B-DFlash", "num_speculative_tokens": 15}}' \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
