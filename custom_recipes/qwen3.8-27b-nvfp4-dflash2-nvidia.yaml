# Recipe: Qwen3.8-27B-NVFP4 + DFlash2 speculative decoding
# The recommended default for Qwen3.8-27B on this cluster -- winner of a
# 4-way NVFP4/FP8 x MTP-5/DFlash2 comparison (see project memory
# qwen38-27b-dflash2-recipe). Sibling of custom_recipes/qwen3.8-27b-nvfp4-mtp5.yaml
# (native MTP-5) for a direct speed/quality comparison -- same target
# checkpoint, swapping the speculative method to DFlash2 (a block-diffusion
# drafter that predicts a whole token block per pass, see incoai's model
# card / the DFlash paper, ICML 2026).
#
# Draft model source: incoai/Qwen3.8-27B-DFlash2, not the z-lab mirror
# (z-lab/Qwen3.8-27B-DFlash2, which its own README describes as a literal
# mirror of the incoai repo -- identical weights). Picked incoai because:
#   1. It's the first-party/originating org for DFlash2 itself (citation on
#      both repos attributes the method to "Inco AI" 2026), not a re-host.
#   2. It already has a proven track record in this exact repo/hardware --
#      incoai/GLM-5.3-Flash-DFlash2 is verified working end-to-end at
#      100.0% draft acceptance on raven+quaker, see
#      custom_recipes/glm5.3-flash-dflash2.yaml / project memory
#      glm53-flash-sm120-blocker.
#   z-lab is itself a legitimate, long-running lab (dozens of DFlash/PARO
#   models since 2025-10, incl. z-lab/Qwen3.6-35B-A3B-DFlash already used in
#   custom_recipes/qwen3.6-35b-a3b-fp8-dflash.yaml) -- not a reliability concern,
#   just redundant to prefer a mirror over the origin when both are equally
#   available. See project memory quant-source-quality-heuristic.
#
# --num_speculative_tokens 7: matches incoai's own documented vLLM launch
# example (block size 7 for vLLM's dflash method; SGLang's example uses 8)
# and the value already verified working for GLM-5.3-Flash-DFlash2.
#
# Unlike GLM-5.3-Flash, Qwen3.8-27B is a plain dense model (no sparse-MLA,
# no MoE) -- no special container/kernel patches needed, just the standard
# vllm-node image and the existing mods/fix-qwen3.8-chat-template.
#
# VERIFIED 2026-08-31 (unsloth/Qwen3.8-27B-NVFP4 checkpoint): launch-tested
# on raven+quaker, 9/9 context-bench.py quality passes (8K/32K/100K tokens x
# 3 depths). Winner of a 4-way NVFP4/FP8 x MTP-5/DFlash2 comparison -- decode
# 31.90 t/s at pp2048, 36.62 t/s at pp16384 (llama-benchy --pp 2048,16384
# --tg 256 --exact-tg --runs 3), best of all four. See
# custom_recipes/qwen3.8-27b-nvfp4-mtp5.yaml, custom_recipes/qwen3.8-27b-fp8-mtp5.yaml,
# custom_recipes/qwen3.8-27b-fp8-dflash2.yaml for the siblings and project memory
# qwen38-27b-dflash2-recipe for the full table.
#
# SWITCHED 2026-09-09 to nvidia/Qwen3.8-27B-NVFP4, NVIDIA's own first-party
# ModelOpt quant (released 2026-09-08, same Qwen3.8-27B base, architecture
# Qwen3_5ForConditionalGeneration -- config-compatible drop-in for the
# unsloth checkpoint, no mod/image changes needed). Same mixed-precision
# layout as the community quants already used here (NVFP4 on MLP + lm_head,
# FP8 on attention/linear-attention -- see quant-source-quality-heuristic)
# but backed by a published methodology (Local-Hessian calibration, 2048
# samples) and a 6-benchmark eval table (GPQA Diamond 88.01 vs BF16's 88.92,
# Terminal-Bench 74.02 vs 75.56, IFBench 78.93 vs 80.07, etc. --
# near-baseline across the board) -- more complete than what unsloth or
# RadixArk published. Also smaller: 20.42GiB / 3 shards vs unsloth's
# 23.42GiB. Added --kv-cache-dtype fp8_e4m3 per NVIDIA's model card,
# matching the FP8-quantized attention layers. NOT YET RE-VERIFIED with
# this checkpoint -- model is still downloading; rerun context-bench.py +
# llama-benchy before trusting the numbers above for this specific source.

recipe_version: "1"
name: Qwen3.8-27B-DFlash2
description: vLLM serving nvidia/Qwen3.8-27B-NVFP4 on DGX Spark (tp2) with DFlash2 spec decode

# UPDATE 2026-10-01: now runs on the rebuilt `vllm-node` (built as `vllm-node-new`, then
# retagged to `vllm-node` on both nodes; vLLM main with
# upstream's SWA block-size patch; `./build-and-copy.sh -t vllm-node-new
# --rebuild-vllm --copy-to`) with --async-scheduling. context-bench 9/9;
# vs the 09-09 `vllm-node`: KV 3,006,859 -> 3,571,267 tokens, prefill 2575 -> 3792
# t/s (pp2048) and 3084 -> 3413 t/s (pp16384), decode unchanged (~39 / ~38 t/s,
# within the +/-3 spread). --enable-chunked-prefill is already the default, so it
# is not passed. Sibling recipes use the same `vllm-node` image now (Flash-Next re-verified
# on it 9/9, decode ~33 t/s, same as before).
# Tried on the same image (async on): 8 draft tokens, --max-num-batched-tokens 16384 and
# --load-format instanttensor. None beat the current settings (decode 38.3 / ~41 / ~40 t/s vs
# ~40.8; prefill 3523 / 3289 / 3682 vs 3793 t/s at pp2048), so the recipe is unchanged.
# instanttensor only cuts model load from ~61 s to ~13 s.

# HuggingFace model
model: nvidia/Qwen3.8-27B-NVFP4

# Container image
container: vllm-node

mods:
  - mods/fix-qwen3.8-chat-template

# Default settings
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 4096
  max_num_seqs: 64
  served_model_name: nvidia/Qwen3.8-27B-NVFP4

# Environment variables
env:
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

# The vLLM serve command template
command: |
  vllm serve nvidia/Qwen3.8-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype fp8_e4m3 \
    --trust-remote-code \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --override-generation-config '{{"temperature": 1.0, "top_p": 0.95, "top_k": 20}}' \
    --speculative-config '{{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}}' \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel} \
    --async-scheduling \
    --distributed-executor-backend ray
