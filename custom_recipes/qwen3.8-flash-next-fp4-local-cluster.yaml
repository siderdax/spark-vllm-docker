# Recipe: Qwen3.8-Flash-Next-FP4-Local (cluster) -- NVIDIA QAD checkpoint, TP2 on raven+quaker
#
# Active default (2026-10-27). Upstream (merge b62168e) settings: A16 MoE decode (VLLM_B12X_MOE_FP4_FORCE_A16=1,
# B12X_W4A16_A4_PREFILL=1), PLE tables in shared memory, NCCL_BUFFSIZE/NCCL_MAX_CTAS, draft_tensor_parallel_size in the
# MTP speculative config. Runs on eugr/spark-vllm-b12x:latest (2026-10-26 build or newer).
# A16 is a precision setting (see the solo recipe header), not a speed one.
# VERIFIED 2026-10-27 (util 0.70): KV 2,384,679 tokens, context-bench 8K/100K/243K pass (89s @243K),
# llama-benchy pp2048/pp16384: prefill 2549/2982 t/s, decode 46.4/50.2 t/s (+/-3-4). vs baseline file: prefill +1.5%,
# decode +8-18% but with 3 runs and several changes at once, so treat as noise-level; ready in ~12 min (cache warm).
# The image logs a harmless ImportError for 'valid_object' (artifacts.py vs cache_integrity.py mismatch) at start.
# Launch with both served names for old clients: ... -- --served-model-name nvidia/Qwen3.8-Flash-Next-FP4-Local nvidia/Qwen3.8-Flash-Next-NVFP4

recipe_version: "1"
name: Qwen3.8-Flash-Next-FP4-Local (Cluster)
description: vLLM serving nvidia/Qwen3.8-Flash-Next-FP4-Local on a dual DGX Spark cluster with shared PLE tables

model: nvidia/Qwen3.8-Flash-Next-FP4-Local
container: eugr/spark-vllm-b12x:latest

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: nvidia/Qwen3.8-Flash-Next-FP4-Local
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 4096
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.7

env:
  VLLM_PLE_TABLE_MEMORY: "shared"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  NCCL_BUFFSIZE: "1048576"
  NCCL_MAX_CTAS: "8"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_MXFP8_LM_HEAD: "1"
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: "w13"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

command: |
  vllm serve nvidia/Qwen3.8-Flash-Next-FP4-Local \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}, "draft_tensor_parallel_size": {tensor_parallel} }}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
