# Recipe: Qwen3.5-122B-A10B-NVFP4
# Qwen3.5-122B in NVIDIA NVFP4 quantization (modelopt).
# 77.8GB weights: fits a single Spark (--solo -tp 1) or 2-node cluster (default).
# Backend flags follow the proven qwen3.6 NVFP4 recipe (marlin MoE + flashinfer + fp8 KV).

recipe_version: "1"
name: Qwen3.5-122B-NVFP4
description: vLLM serving nvidia/Qwen3.5-122B-A10B-NVFP4

# HuggingFace model to download (optional, for --download-model)
model: nvidia/Qwen3.5-122B-A10B-NVFP4

# Container image to use
container: vllm-node

# Chat template fix applies to the whole Qwen3.5 family
mods:
  - mods/fix-qwen3.5-chat-template

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 8192

# Environment variables
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  # quaker(워커 노드)는 인터넷이 없어 HF Hub 조회(merges.txt 등)가
  # DNS 실패로 죽고 tokenizer 로드가 실패함. 로컬 캐시만 쓰도록 강제.
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1

# The vLLM serve command template
command: |
  vllm serve nvidia/Qwen3.5-122B-A10B-NVFP4 \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --moe-backend marlin \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --chat-template unsloth.jinja \
    -tp {tensor_parallel} --distributed-executor-backend ray \
    --max-num-batched-tokens {max_num_batched_tokens}
