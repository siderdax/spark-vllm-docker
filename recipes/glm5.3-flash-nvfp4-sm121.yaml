# Recipe: GLM-5.3-Flash-NVFP4 on DGX Spark (GB10, sm_121), TP2
#
# GLM-5.3-Flash uses NoPE MLA (qk_rope_head_dim=0), architecturally different from
# DeepSeek's MLA (pe_dim=64) that vLLM's stock SM120 sparse-attention kernel
# (FLASHINFER_MLA_SPARSE_SM120) was written for. On GB10 that's the *only* stock
# sparse-MLA backend for compute capability 12, and it hard-crashes in warmup:
#   concat_and_cache_mla: pe_dim must be 64 for fp8_ds_mla
# Confirmed upstream in vllm-project/vllm#53963 (open, unfixed as of 2026-08-28):
# no SM120 sparse-MLA kernel exists for the rope-free shape. See project memory
# glm53-flash-sm120-blocker for our own earlier (abandoned) attempt at patching
# the SM120 kernel directly.
#
# mods/glm53-flash-sm121 takes a different path: it extends FLASHINFER_MLA_SPARSE_SM90
# (Hopper's NoPE-native backend, never coupled to DeepSeek's pe_dim=64 assumption) to
# also accept SM120/121, plus the FlashInfer nightly + package repins + PDL gate +
# kpool-indexer hardening that backend needs to actually run clean on GB10. Adapted
# from the (independently reviewed, file-by-file) community patch stack at
# github.com/barrydeen/glm53-flash-dgx-spark — see that mod's run.sh for full
# attribution and per-patch rationale.
#
# This is the plain bf16-KV baseline (no fp8 KV cache, no DFlash2 speculative
# decoding — that upstream PR's draft model is CC-BY-NC-ND, non-commercial only).
# UNVERIFIED as of first write: this is our first real launch attempt with these
# patches on raven+quaker. If it breaks, check docs/TROUBLESHOOTING-style notes
# in mods/glm53-flash-sm121/run.sh output first — every patch step logs its own
# [vN] status line.
#
# Weights: LibertAIDAI/GLM-5.3-Flash-NVFP4 (~182GB, MIT-licensed NVFP4 quant of
# zai-org/GLM-5.3-Flash). Chosen over our previously-cached RedHatAI/GLM-5.3-Flash-NVFP4
# (see project memory) because the patch stack's kpool/tensor-shape assumptions were
# verified against this specific checkpoint's actual tensor shapes.

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4-SM121
description: vLLM serving LibertAIDAI/GLM-5.3-Flash-NVFP4 on DGX Spark (GB10/sm_121) via a ported SM90 NoPE-MLA attention backend

# HuggingFace model to download (optional, for --download-model)
model: LibertAIDAI/GLM-5.3-Flash-NVFP4

# Container image to use — official per-model vLLM image for GLM-5.3-Flash
container: vllm/vllm-openai:glm53-flash-arm64-cu130

# Mods to apply before launch
mods:
  - mods/glm53-flash-sm121

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 32768
  max_num_seqs: 4
  max_num_batched_tokens: 8192

# Environment variables
env:
  # quaker(워커 노드)는 인터넷이 없어 HF Hub 조회(merges.txt 등)가
  # DNS 실패로 죽고 tokenizer 로드가 실패함. 로컬 캐시만 쓰도록 강제.
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1

# The vLLM serve command template
command: |
  vllm serve LibertAIDAI/GLM-5.3-Flash-NVFP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --served-model-name glm-5.3-flash \
    --attention-backend FLASHINFER_MLA_SPARSE_SM90 \
    --block-size 2304 \
    --enforce-eager \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice
