# Recipe: Qwen3.6-27B-NVFP4
# Qwen3.6-27B dense model (hybrid Gated DeltaNet + Gated Attention) in NVIDIA
# NVFP4 quantization (modelopt). ~14GB weights — about half the FP8 checkpoint's
# footprint, so it fits solo with plenty of headroom for KV cache/context, and
# tp2 mainly helps decode latency on this compute-bound dense model rather than
# unlocking more memory.
# Chosen over FP8 when you want the smaller footprint / faster decode and can
# accept NVFP4's more aggressive quantization (FP8 stays closer to bf16 quality):
# recipes/qwen3.6-27b-fp8.yaml
# Modes: run-qwen3.6-27b-nvfp4.sh (tp2 cluster, default) / run-qwen3.6-27b-nvfp4-solo.sh (tp1 solo) / run-qwen3.6-27b-nvfp4-pp2.sh (pp2 cluster)
#
# Sampling: --override-generation-config below sets Qwen's documented thinking-mode
# defaults (temperature=1.0, top_p=0.95, top_k=20) — vLLM's own top_k default is
# unbounded (-1), which diverges from Qwen's recommendation and can let <think>
# generations ramble. This only fills gaps: a client that sends its own sampling
# params still wins.
#
# Unlike Qwen3.8, this chat template (mods/fix-qwen3.6-chat-template) has no
# reasoning_effort mechanism — thinking is just on/off, no xhigh/medium/low budget.
# preserve_thinking still defaults to true though, and re-injects every prior turn's
# full <think> block into context on multi-turn requests, which snowballs context
# size (and latency) over a long opencode/agentic session:
#   --default-chat-template-kwargs '{"preserve_thinking": false}'
#
# Tool-call parser: qwen3_xml (below) is correct — do not switch to qwen3_coder even
# though Qwen's own model card recommends it. It has a known vLLM bug (infinite "!"
# stream on long inputs with a tool call, vllm-project/vllm#39056) affecting the
# whole Qwen3 family, not just this model.

recipe_version: "1"
name: Qwen3.6-27B-NVFP4
description: vLLM serving nvidia/Qwen3.6-27B-NVFP4 (dense, solo or tp2)

# HuggingFace model to download (optional, for --download-model)
model: nvidia/Qwen3.6-27B-NVFP4

# Container image to use
container: vllm-node

mods:
  - mods/fix-qwen3.6-chat-template

# Default settings (can be overridden via CLI). tensor_parallel:2 is the
# cluster default; run-qwen3.6-27b-nvfp4-solo.sh overrides to --tensor-parallel 1.
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 262144

# Environment variables
# quaker(워커 노드)는 인터넷이 없어 HF Hub 조회(merges.txt 등)가
# DNS 실패로 죽고 tokenizer 로드가 실패함. 로컬 캐시만 쓰도록 강제.
# (컨테이너 레벨 -e로도 넣어야 Ray 워커까지 확실히 전파됨: run-qwen3.6-27b-nvfp4.sh 참고)
env:
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1

# The vLLM serve command template
command: |
  vllm serve nvidia/Qwen3.6-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --override-generation-config '{{"temperature": 1.0, "top_p": 0.95, "top_k": 20}}' \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":4}}' \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
