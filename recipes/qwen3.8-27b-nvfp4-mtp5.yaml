# Recipe: Qwen3.8-27B-NVFP4 (MTP-5)
# Sibling of recipes/qwen3.8-27b-nvfp4.yaml (MTP-3 default), same target
# checkpoint (unsloth/Qwen3.8-27B-NVFP4 -- see that recipe's header for the
# 3-way source bench that picked it), num_speculative_tokens bumped 3 -> 5
# for a 4-way NVFP4/FP8 x MTP-5/DFlash2 comparison requested 2026-08-31.
#
# VERIFIED 2026-08-31: 9/9 context-bench.py quality passes. Decode 33.22 t/s
# at pp2048, 26.20 t/s at pp16384 -- loses to recipes/qwen3.8-27b-dflash2.yaml
# (NVFP4+DFlash2, 36.62 t/s at pp16384) at longer prompts. See project memory
# qwen38-27b-dflash2-recipe for the full 4-way table.

recipe_version: "1"
name: Qwen3.8-27B-NVFP4-MTP5
description: vLLM serving unsloth/Qwen3.8-27B-NVFP4 on DGX Spark (tp2) with MTP-5

# HuggingFace model
model: unsloth/Qwen3.8-27B-NVFP4

# Container image
container: vllm-node

mods:
  - mods/fix-qwen3.8-chat-template

# Default settings
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 131072
  max_num_batched_tokens: 4096
  max_num_seqs: 64
  served_model_name: qwen3.8-27b

# Environment variables
env:
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

# The vLLM serve command template
command: |
  vllm serve unsloth/Qwen3.8-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --override-generation-config '{{"temperature": 1.0, "top_p": 0.95, "top_k": 20}}' \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":5}}' \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
