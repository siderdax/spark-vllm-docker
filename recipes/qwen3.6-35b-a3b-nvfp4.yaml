# Recipe: Qwen3.6-35B-A3B-NVFP4-Marlin
# Qwen3.6-35B-A3B model in NVIDIA NVFP4 format with Marlin MoE backend.
#
# Sampling: --override-generation-config below sets Qwen's documented thinking-mode
# defaults for this A3B (MoE) variant: temperature=1.0, top_p=0.95, top_k=20,
# presence_penalty=1.5 — note presence_penalty=1.5 here vs 0.0 recommended for the
# dense 27B model (helps avoid MoE repetition loops). vLLM's own top_k/presence_penalty
# defaults (-1 / 0.0) diverge from this, so this only fills gaps for clients that
# don't set their own sampling params. This recipe uses the stock HF chat template
# (no local mods/fix-qwen3.6-chat-template override), so no reasoning_effort or
# preserve_thinking claims from the other Qwen3.6 recipes are asserted here.
#
# Tool-call parser: qwen3_xml (below) is correct — do not switch to qwen3_coder even
# though Qwen's own model card recommends it. It has a known vLLM bug (infinite "!"
# stream on long inputs with a tool call, vllm-project/vllm#39056) affecting the
# whole Qwen3 family, not just this model.

recipe_version: "1"
name: Qwen3.6-35B-A3B-NVFP4-Marlin
description: vLLM serving nvidia/Qwen3.6-35B-A3B-NVFP4 with Marlin MoE backend

# HuggingFace model to download (optional, for --download-model)
model: nvidia/Qwen3.6-35B-A3B-NVFP4

# Container image to use
container: vllm-node

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.4
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 8192

# Environment variables
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  # quaker(워커 노드)는 인터넷이 없어 HF Hub 조회(merges.txt 등)가
  # DNS 실패로 죽고 tokenizer 로드가 실패함. 로컬 캐시만 쓰도록 강제.
  # (컨테이너 레벨 -e로도 넣어야 Ray 워커까지 확실히 전파됨: run-qwen3.6-35b.sh 참고)
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1

# The vLLM serve command template
command: |
  vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --moe-backend marlin \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":4,"moe_backend":"triton"}}' \
    --load-format fastsafetensors \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --override-generation-config '{{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "presence_penalty": 1.5}}' \
    --distributed-executor-backend ray
