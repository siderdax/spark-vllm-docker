# Recipe: Qwen3.8-27B-FP8 (MTP-5)
# Sibling of recipes/qwen3.8-27b-fp8.yaml (MTP-4 default), same target
# checkpoint (Qwen/Qwen3.8-27B-FP8), num_speculative_tokens bumped 4 -> 5
# for a 4-way NVFP4/FP8 x MTP-5/DFlash2 comparison requested 2026-08-31.
# See qwen3.8-27b-fp8.yaml for the full flag rationale (chat template,
# sampling defaults, tool-call parser) -- unchanged here.
#
# VERIFIED 2026-08-31: 9/9 context-bench.py quality passes, but decode is
# clearly memory-bandwidth-bound and MTP-5 barely helps -- flat 18.91 t/s at
# pp2048, 18.81 t/s at pp16384. Worst of the 4-way comparison by a wide
# margin; see recipes/qwen3.8-27b-fp8-dflash2.yaml for the same checkpoint
# with DFlash2 instead (28-31 t/s). See project memory
# qwen38-27b-dflash2-recipe for the full table.

recipe_version: "1"
name: Qwen3.8-27B-FP8-MTP5
description: vLLM serving Qwen/Qwen3.8-27B-FP8 (dense, tp2) with MTP-5

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.8-27B-FP8

# Container image to use
container: vllm-node

mods:
  - mods/fix-qwen3.8-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 262144

env:
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1

command: |
  vllm serve Qwen/Qwen3.8-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --override-generation-config '{{"temperature": 1.0, "top_p": 0.95, "top_k": 20}}' \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":5}}' \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
