# Recipe: Qwen3.8-27B-NVFP4 (MTP-3 Default)
# Model: unsloth/Qwen3.8-27B-NVFP4 (23.42 GiB), "Unsloth Dynamic V3.0" quant --
# mixed-precision (attention + lm_head at 8-bit, MLP at 4-bit), 1.8M downloads.
# Switched from Inferact/Qwen3.8-27B-NVFP4 2026-08-29 after a 3-way bench
# (Inferact/RadixArk/unsloth, see project memory quant-source-quality-heuristic):
# Inferact was slowest (24.0 t/s decode) with no published quant methodology or
# eval data and uniform 4-bit quantization including attention -- retired
# entirely, no longer cached anywhere. RadixArk was fastest (35.3 t/s) and has
# published audited GSM8K/AIME26 scores, but this recipe picked unsloth as the
# steady middle ground (23.42GB, between Inferact's 26.38GB and RadixArk's
# 21.92GB; 30.25 t/s decode). RadixArk's checkpoint+recipe were retired after
# the bench (not kept on standby) -- backed up at fregata if ever needed again,
# see project memory quant-source-quality-heuristic.

recipe_version: "1"
name: Qwen3.8-27B-NVFP4
description: vLLM serving unsloth/Qwen3.8-27B-NVFP4 on DGX Spark (tp2) with MTP-3

# HuggingFace model
model: unsloth/Qwen3.8-27B-NVFP4

# Container image
container: vllm-node

mods:
  - mods/fix-qwen3.8-chat-template

# Default settings
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 131072
  max_num_batched_tokens: 4096
  max_num_seqs: 64
  served_model_name: qwen3.8-27b

# Environment variables
env:
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

# The vLLM serve command template
command: |
  vllm serve unsloth/Qwen3.8-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --override-generation-config '{{"temperature": 1.0, "top_p": 0.95, "top_k": 20}}' \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":3}}' \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
