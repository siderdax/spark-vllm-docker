# Recipe: Qwen3.8-27B-FP8
# Qwen3.8-27B: native vision-language dense model (hybrid Gated DeltaNet + Gated
# Attention, same "Qwen3_5ForConditionalGeneration" architecture family as
# Qwen3.6-27B, now with an attached ViT + image/video tokens) in native FP8.
# ~27GB weights (+ small vision tower) — fits solo on a single Spark node with
# headroom, but also supports tp2 across raven+quaker (dense = compute-bound,
# so splitting can still help decode latency even though it doesn't need the
# extra memory).
# Chosen over hypothetical NVFP4 for quality, same rationale as Qwen3.6-27B-FP8:
# recipes/qwen3.6-27b-fp8.yaml
#
# Chat template: Qwen3.8's shipped chat_template.jinja is the same vintage/bugs
# as the pre-fix Qwen3.6 template (no developer-role support, tool_call argument
# handling breaks on non-mapping args, no auto-close for a dangling <think> before
# a <tool_call>) — see mods/fix-qwen3.6-chat-template. Unlike Qwen3.6, Qwen3.8's
# template also carries a reasoning_effort (xhigh/medium/low) system-prompt
# injection that the plain qwen3.6 fix doesn't have, so blindly reusing that mod
# would silently drop a headline Qwen3.8 feature. mods/fix-qwen3.8-chat-template
# ports the same robustness fixes onto Qwen3.8's actual template instead, keeping
# reasoning_effort intact. Tune it per-request via:
#   --default-chat-template-kwargs '{"reasoning_effort": "low"}'   (or "medium"/"xhigh", default xhigh)
#   --default-chat-template-kwargs '{"enable_thinking": false}'    (disable thinking entirely)
#
# MTP: the checkpoint ships a trained MTP draft head (mtp.safetensors). Not
# enabled by default here for stability (this repo has no prior track record
# running Qwen's native `mtp` speculative method, only the separate DFlash
# draft model used by recipes/qwen3.6-35b-a3b-fp8-dflash.yaml). To try it:
#   --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
#
# Verified against the official vLLM recipe: https://recipes.vllm.ai/Qwen/Qwen3.8-27B
# Modes: run-qwen3.8-27b.sh (tp2 cluster, default) / run-qwen3.8-27b-solo.sh (tp1 solo) / run-qwen3.8-27b-pp2.sh (pp2 cluster)
#
# --- Troubleshooting: opencode session hangs with no output ---
#
# Sampling: --override-generation-config below sets Qwen's documented thinking-mode
# defaults (temperature=1.0, top_p=0.95, top_k=20 — vLLM's own top_k default is
# unbounded (-1), which diverges from Qwen's recommendation and can let thinking
# ramble/loop). This only fills gaps: a client (e.g. opencode) that explicitly sends
# its own temperature/top_p still wins, so this isn't a full fix if the client is
# misconfigured — see the diagnostic step below. min_p/presence_penalty are left
# alone since vLLM's defaults (0.0/0.0) already match Qwen's recommendation.
#
# reasoning_effort defaults to xhigh (see chat-template note above). Community
# reports (and Simon Willison's own benchmark: ~21 min / 22k reasoning tokens for a
# single pelican SVG on DGX Spark/M5 Max) show xhigh can take 20-90 min even on
# simple prompts. If a session looks hung, try lowering effort first:
#   --default-chat-template-kwargs '{"reasoning_effort": "medium"}'
#
# preserve_thinking defaults to true in the template, which re-injects every prior
# turn's full <think> block into context on multi-turn requests — this snowballs
# context size (and therefore latency) over a long opencode/agentic session. Disable
# it for long coding sessions with:
#   --default-chat-template-kwargs '{"preserve_thinking": false}'
#
# Diagnosing a hang: curl the server directly with
# stream_options: {"include_usage": true} and check finish_reason.
#   "length" with completion_tokens pinned at the request's max_tokens -> the
#     reasoning budget was exhausted before any content was emitted (lower
#     reasoning_effort or raise max_tokens).
#   "stop" with empty content -> reasoning-parser mismatch, not a budget issue.
#   curl returns fine but opencode shows nothing -> opencode/proxy-side timeout,
#     not this server.
#
# Tool-call parser: qwen3_xml (below) is the correct choice, confirmed against vLLM
# docs/issue tracker. qwen3_coder has a known vLLM bug producing an infinite stream
# of "!" on long inputs containing a tool call — do not switch to it.
#
# TP2 (raven+quaker) vs TP1-solo: benchmarked 2026-08-20 with llama-benchy
# (--pp 2048,16384 --tg 256 --exact-tg --concurrency 1 --runs 3, thinking off,
# identical flags otherwise incl. --override-generation-config above). TP2 won
# clearly on *both* axes, even at concurrency=1 (single interactive request):
#   pp2048:  tp2 2719 t/s  vs  solo 1936 t/s   (+40%)
#   pp16384: tp2 2847 t/s  vs  solo 1793 t/s   (+59%)
#   tg256:   tp2 15.2 t/s  vs  solo  8.4 t/s   (+81%, ~2x)
# Counter-intuitive if you assume TP overhead is dominated by cross-node
# all-reduce latency (that intuition holds on NVLink-connected multi-GPU
# servers, where comms are near-free vs FLOPs) — but raven+quaker are separate
# GB10 chips with their own local (bandwidth-limited, unified LPDDR5X) memory,
# connected by a *direct* QSFP/RoCE link (no switch hop). Decode is
# memory-bandwidth-bound: reading ~27GB of weights per step off one chip's
# local memory is the bottleneck, and TP2 roughly halves that per-chip read by
# splitting the weights across two independent memory pools — a near-linear
# win that the (apparently small, thanks to the direct link) network tax
# doesn't come close to offsetting. tp2 is the right default; don't switch to
# solo for latency reasons. MTP speculative decoding (commented above) was not
# part of this benchmark and remains untested.

recipe_version: "1"
name: Qwen3.8-27B-FP8
description: vLLM serving Qwen/Qwen3.8-27B-FP8 (dense, vision-language, solo or tp2)

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.8-27B-FP8

# Container image to use
container: vllm-node

mods:
  - mods/fix-qwen3.8-chat-template

# Default settings (can be overridden via CLI). tensor_parallel:2 is the
# cluster default; run-qwen3.8-27b-solo.sh overrides to --tensor-parallel 1.
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 262144

# Environment variables
# quaker(워커 노드)는 인터넷이 없어 HF Hub 조회(merges.txt 등)가
# DNS 실패로 죽고 tokenizer 로드가 실패함. 로컬 캐시만 쓰도록 강제.
# (컨테이너 레벨 -e로도 넣어야 Ray 워커까지 확실히 전파됨: run-qwen3.8-27b.sh 참고)
env:
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1

# The vLLM serve command template
command: |
  vllm serve Qwen/Qwen3.8-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --override-generation-config '{{"temperature": 1.0, "top_p": 0.95, "top_k": 20}}' \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":4}}' \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
