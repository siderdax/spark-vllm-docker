# Recipe: DeepSeek V4 Flash 0731 (upstream/original variant — NOT the active recipe)
# DeepSeek V4 Flash using the B12X-optimized serving stack on an SM121 cluster
#
# Kept for reference only. This is upstream (eugr/spark-vllm-docker main)'s version
# of the 0731 recipe; the recipe this fork actually uses is
# recipes/deepseek-v4-flash-0731.yaml. run-dsv4f-0731.sh points at that one, not
# this file.
#
# Benchmarked head-to-head on raven+quaker 2026-08-26:
# - container: vllm-node-b12x here resolves to the exact same image as our
#   eugr/spark-vllm-b12x:latest (build-and-copy.sh's --exp-b12x path just pulls
#   and re-tags that image unless --rebuild-vllm is also passed) — no real
#   compiled difference, confirmed by identical pp2048/tg256 throughput.
# - mods/instanttensor-hybrid-draft-loader (used only by this variant) made
#   DSpark draft-weight loading *slower*, not faster: 30.58s vs 20.05s without
#   the mod (total model load 63.2s vs 50.9s, +24%). InstantTensor's sequential
#   GPU-streaming pass over the 155GB checkpoint is already fast enough (~20s)
#   that the mod's lazy-safetensors random-access path for the tiny 97-param
#   DSpark draft head didn't pay off here.
# Conclusion: recipes/deepseek-v4-flash-0731.yaml (no mod, tuned defaults,
# --override-generation-config, reasoning_effort=max) stays the active recipe.
# Re-benchmark this file if upstream changes the mod or the b12x image
# meaningfully.

recipe_version: "1"
name: DeepSeek-V4-Flash-0731
description: vLLM serving deepseek-ai/DeepSeek-V4-Flash-0731 on a dual Sparks using B12X docker

model: deepseek-ai/DeepSeek-V4-Flash-0731
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods:
  - mods/instanttensor-hybrid-draft-loader
#   - mods/drop-caches

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: auto
  block_size: 256
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 5

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'
