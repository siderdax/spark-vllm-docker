# Recipe: Qwen3.6-27B-FP8
# Qwen3.6-27B dense model (hybrid Gated DeltaNet + Gated Attention) in native FP8.
# ~27GB weights — fits solo on a single Spark node with headroom, but also
# supports tp2 across raven+quaker (dense = compute-bound, so splitting can still
# help decode latency even though it doesn't need the extra memory).
# Chosen over NVFP4 for quality: Qwen's own FP8 release claims near-identical
# performance to the original bf16 model; NVFP4 is a more aggressive quantization.
# Modes: run-qwen3.6-27b.sh (tp2 cluster, default) / run-qwen3.6-27b-solo.sh (tp1 solo)

recipe_version: "1"
name: Qwen3.6-27B-FP8
description: vLLM serving Qwen/Qwen3.6-27B-FP8 (dense, solo or tp2)

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.6-27B-FP8

# Container image to use
container: vllm-node

mods:
  - mods/fix-qwen3.6-chat-template

# Default settings (can be overridden via CLI). tensor_parallel:2 is the
# cluster default; run-qwen3.6-27b-solo.sh overrides to --tensor-parallel 1.
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 262144

# Environment variables
# quaker(워커 노드)는 인터넷이 없어 HF Hub 조회(merges.txt 등)가
# DNS 실패로 죽고 tokenizer 로드가 실패함. 로컬 캐시만 쓰도록 강제.
# (컨테이너 레벨 -e로도 넣어야 Ray 워커까지 확실히 전파됨: run-qwen3.6-27b.sh 참고)
env:
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1

# The vLLM serve command template
command: |
  vllm serve Qwen/Qwen3.6-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
